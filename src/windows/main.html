<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamSnap - Screen Recorder</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://yt3.ggpht.com; media-src 'self' blob:;"
    />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * { margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(to bottom right, #f1f5f9, #dbeafe); }
      .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="spinner"></div>
    </div>
    <script>
      window.__isMainWindow = true;
      document.addEventListener('DOMContentLoaded', () => {
        window.electronAPI?.showMainWindow?.().catch(() => {})
      })
    </script>
    <script src="../js/main-ui-template.js"></script>
  </body>
</html>
