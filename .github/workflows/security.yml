# .github/workflows/security.yml
name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # lunes 8 UTC

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps)
        # moderate: incluye CVEs medios además de alto/crítico
        run: npm audit --audit-level=moderate --omit=dev
      - name: npm audit (dev deps, informativo)
        # No bloqueante: la cadena brace-expansion/minimatch (GHSA-mh99-v99m-4gvg,
        # DoS en tooling de build) no tiene fix upstream para eslint@8 ni
        # @electron/asar; brace-expansion@5.0.8 cambia la API y romperia ambos.
        run: npm audit --audit-level=moderate
        continue-on-error: true

  trivy:
    name: Trivy (SCA + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Trivy filesystem scan
        # Escanea node_modules (CVEs) y el código fuente (secretos hardcodeados)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
