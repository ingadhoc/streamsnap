name: Test Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, pull request ref, or commit to build from"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
            build_command: npm run build:linux
            artifact_globs: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
              dist/*.blockmap
              dist/latest-linux.yml
          - os_name: windows
            runner: windows-latest
            build_command: npm run build:win
            artifact_globs: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml

    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OAuth secrets and create .env
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "Missing required OAuth secrets."
            echo "Expected repository secrets: GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET"
            exit 1
          fi

          {
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
          } > .env

          chmod 600 .env
          echo "Created .env for test build."

      - name: Build artifacts
        run: ${{ matrix.build_command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streamsnap-${{ matrix.os_name }}-${{ github.event.pull_request.number || github.run_number }}-${{ steps.metadata.outputs.short_sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ matrix.artifact_globs }}
